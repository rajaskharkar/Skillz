name: Android Scyra

on:
  pull_request:
  push:
    branches: [main]

jobs:
  localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify localization parity
        run: python3 scripts/verify_localization_parity.py

  compile-and-assemble:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - run: ./gradlew :app:compileScyraDebugKotlin :app:assembleScyraDebug

  unit-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - name: Run Scyra unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testScyraDebugUnitTest --stacktrace --info 2>&1 | tee unit-tests.log
      - name: Upload unit-test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scyra-unit-test-results
          if-no-files-found: warn
          path: |
            android/unit-tests.log
            android/app/build/test-results/testScyraDebugUnitTest/**
            android/app/build/reports/tests/testScyraDebugUnitTest/**

  lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - name: Run Scyra lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:lintScyraDebug --stacktrace 2>&1 | tee lint.log
      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scyra-lint-results
          if-no-files-found: warn
          path: |
            android/lint.log
            android/app/build/reports/lint-results-scyraDebug.html
            android/app/build/reports/lint-results-scyraDebug.xml
            android/app/build/reports/lint-results-scyraDebug.sarif

  migration-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: android
          script: ./gradlew :app:connectedScyraDebugAndroidTest
